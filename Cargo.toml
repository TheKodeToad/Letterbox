[package]
name = "letterbox"
version = "1.1.4"
edition = "2021"

[dependencies]
chrono = "0.4.39"
color-eyre = "0.6.3"
deadpool-postgres = "0.14.1"
dotenvy = "0.15.7"
env_logger = "0.11.5"
eyre = "0.6.12"
log = "0.4.22"
poise = "0.6.1"
refinery = { version = "0.9.0", features = ["tokio-postgres"] }
serde = "1.0.215"
serenity = "0.12.5"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "signal"] }
tokio-postgres = { version = "0.7.9", features = ["with-chrono-0_4"] }
toml = "1.0.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
complexity = "warn"
correctness = "deny"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "deny"
