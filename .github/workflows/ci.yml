name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

jobs:
  flake:
    name: Flake checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run checks
        run: |
          nix flake check --print-build-logs --show-trace
